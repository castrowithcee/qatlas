# Optional Claude status line configuration at ~/.qatlas/plugins/statusline.yaml. Qatlas ships every
# default; this file holds only what deviates. The values below are the shipped defaults. Codex uses its
# native TUI settings instead.
format: 1

# Use "fixed" when terminal wrapping hides widgets.
layout: wrap

separator:
  text: " • "
  fg: "#aee414"
  bold: true

defaults:
  label:
    fg: "#7dcaf6"
  value:
    # An empty value keeps the terminal foreground color.
    fg: ""

# Without this map every shipped widget appears in the shipped order. With it, the map order is the render
# order and widgets missing from it stay off.
widgets:
  model:
    on: true
    value:
      fg: "#f72585"
  thinking:
    on: true
  dir:
    on: true
    value:
      fg: "#f72585"
  branch:
    on: true
    value:
      fg: "#f72585"
  diff:
    on: true
  out:
    on: true
  context:
    on: true
    bar:
      # The last threshold reached gives the semantic color.
      thresholds:
        - from: 0
          fg: "#24e302"
        - from: 30
          fg: "#f0c808"
        - from: 40
          fg: "#ff6131"
        - from: 70
          fg: red
  cost:
    on: true
  session:
    on: true
    bar:
      thresholds:
        - from: 0
          fg: "#24e302"
        - from: 30
          fg: "#f0c808"
        - from: 40
          fg: "#ff6131"
        - from: 85
          fg: red
  session-reset:
    on: true
  weekly:
    on: true
    bar:
      thresholds:
        - from: 0
          fg: "#24e302"
        - from: 30
          fg: "#f0c808"
        - from: 40
          fg: "#ff6131"
        - from: 85
          fg: red
  weekly-reset:
    on: true
  method:
    on: true
